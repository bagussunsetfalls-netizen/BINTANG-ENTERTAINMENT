<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bintang Entertainment</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

body {
  background: linear-gradient(135deg, #020617, #0f172a);
  color: white;
}

/* HERO */
.hero {
  text-align: center;
  padding: 100px 20px;
}

.hero h1 {
  font-size: 42px;
}

.hero p {
  opacity: 0.7;
}

/* SECTION */
.section {
  padding: 50px 20px;
  text-align: center;
}

.section h2 {
  margin-bottom: 30px;
}

/* CARD */
.container {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 20px;
}

.card {
  background: rgba(255,255,255,0.05);
  padding: 20px;
  border-radius: 15px;
  width: 220px;
  backdrop-filter: blur(10px);
  transition: 0.3s;
}

.card:hover {
  transform: scale(1.05);
}

.card img {
  width: 100%;
  border-radius: 10px;
  margin-bottom: 10px;
}

.role {
  font-size: 13px;
  opacity: 0.6;
}
</style>

</head>

<body>

<!-- HERO -->
<section class="hero">
  <h1>🌌 BINTANG ENTERTAINMENT</h1>
  <p>"Shining Behind The Scene"</p>
</section>

<!-- STAFF -->
<section class="section">
  <h2>🛠️ Official Staff</h2>

  <div class="container">

    <div class="card">
      <img src="https://i.imgur.com/8Km9tLL.jpg">
      <h3>Bagus</h3>
      <p class="role">Founder</p>
    </div>

    <div class="card">
      <img src="https://i.imgur.com/2DhmtJ4.jpg">
      <h3>Allena</h3>
      <p class="role">CEO</p>
    </div>

    <div class="card">
      <img src="https://i.imgur.com/jQ9XGQx.jpg">
      <h3>Ella</h3>
      <p class="role">Manager</p>
    </div>

    <div class="card">
      <img src="https://i.imgur.com/jQ9XGQx.jpg">
      <h3>Ahsya</h3>
      <p class="role">Manager</p>
    </div>

  </div>
</section>

<!-- IDOL -->
<section class="section">
  <h2>🎤 Idol Members</h2>

  <div class="container">

    <div class="card">
      <img src="https://i.imgur.com/3ZQ3Z9r.jpg">
      <h3>Coming Soon</h3>
      <p class="role">Trainee</p>
    </div>

    <div class="card">
      <img src="https://i.imgur.com/3ZQ3Z9r.jpg">
      <h3>Coming Soon</h3>
      <p class="role">Trainee</p>
    </div>

  </div>
</section>

</body>
</html>
