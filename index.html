<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bintang Entertainment</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

body {
  background: #020617;
  color: white;
  overflow-x: hidden;
}

/* 🌠 STAR BACKGROUND */
.stars {
  position: fixed;
  width: 100%;
  height: 100%;
  z-index: -1;
}

.stars::after {
  content: "";
  position: absolute;
  width: 2px;
  height: 2px;
  background: white;
  box-shadow:
    50px 100px white,
    200px 300px white,
    400px 150px white,
    600px 250px white,
    800px 400px white,
    1000px 200px white,
    1200px 500px white,
    1400px 350px white;
  animation: animStar 20s linear infinite;
}

@keyframes animStar {
  from { transform: translateY(0); }
  to { transform: translateY(-1000px); }
}

/* NAVBAR */
nav {
  display: flex;
  justify-content: space-between;
  padding: 20px 50px;
  position: sticky;
  top: 0;
  background: rgba(0,0,0,0.3);
  backdrop-filter: blur(10px);
}

nav h2 {
  color: #38bdf8;
}

nav a {
  color: white;
  margin-left: 20px;
  text-decoration: none;
}

/* HERO */
.hero {
  text-align: center;
  padding: 120px 20px;
}

.hero h1 {
  font-size: 45px;
}

.hero span {
  color: #38bdf8;
}

.hero p {
  opacity: 0.7;
}

/* SECTION */
.section {
  padding: 60px 20px;
  text-align: center;
}

.container {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 20px;
}

/* CARD */
.card {
  background: rgba(255,255,255,0.05);
  padding: 20px;
  border-radius: 15px;
  width: 230px;
  backdrop-filter: blur(10px);
  transition: 0.3s;
}

.card:hover {
  transform: scale(1.08);
  box-shadow: 0 0 20px #38bdf8;
}

.card img {
  width: 100%;
  border-radius: 10px;
  margin-bottom: 10px;
}

.role {
  font-size: 13px;
  opacity: 0.6;
}

/* FOOTER */
footer {
  text-align: center;
  padding: 20px;
  opacity: 0.5;
}
</style>

</head>

<body>

<div class="stars"></div>

<!-- NAVBAR -->
<nav>
  <h2>BINTANG</h2>
  <div>
    <a href="#">Home</a>
    <a href="#">Staff</a>
    <a href="#">Idol</a>
  </div>
</nav>

<!-- HERO -->
<section class="hero">
  <h1>🌌 <span>BINTANG</span> ENTERTAINMENT</h1>
  <p>"Shining Behind The Scene"</p>
</section>

<!-- STAFF -->
<section class="section">
  <h2>🛠️ Official Staff</h2>

  <div class="container">

    <div class="card">
      <img src="https://i.imgur.com/8Km9tLL.jpg">
      <h3>Bagus</h3>
      <p class="role">Founder</p>
    </div>

    <div class="card">
      <img src="https://i.imgur.com/2DhmtJ4.jpg">
      <h3>Allena</h3>
      <p class="role">CEO</p>
    </div>

    <div class="card">
      <img src="https://i.imgur.com/jQ9XGQx.jpg">
      <h3>Ella</h3>
      <p class="role">Manager</p>
    </div>

    <div class="card">
      <img src="https://i.imgur.com/jQ9XGQx.jpg">
      <h3>Ahsya</h3>
      <p class="role">Manager</p>
    </div>

  </div>
</section>

<!-- IDOL -->
<section class="section">
  <h2>🎤 Idol Members</h2>

  <div class="container">

    <div class="card">
      <img src="https://i.imgur.com/3ZQ3Z9r.jpg">
      <h3>Coming Soon</h3>
      <p class="role">Trainee</p>
    </div>

    <div class="card">
      <img src="https://i.imgur.com/3ZQ3Z9r.jpg">
      <h3>Coming Soon</h3>
      <p class="role">Trainee</p>
    </div>

  </div>
</section>

<!-- FOOTER -->
<footer>
  © 2026 Bintang Entertainment
</footer>

</body>
</html>
